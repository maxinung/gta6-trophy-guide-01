<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA 6 Trophy Guide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>GTA 6 Trophy Guide</h1>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
      <span class="progress-text" id="progressText">0 / 55 (0%)</span>
    </div>
  </header>

  <nav class="toolbar">
    <div class="filter-group">
      <label>Grade:</label>
      <select id="gradeFilter">
        <option value="all">All</option>
        <option value="platinum">Platinum</option>
        <option value="gold">Gold</option>
        <option value="silver">Silver</option>
        <option value="bronze">Bronze</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Type:</label>
      <select id="typeFilter">
        <option value="all">All</option>
        <option value="story">Story</option>
        <option value="side">Side</option>
        <option value="collection">Collection</option>
        <option value="stunt">Stunt</option>
      </select>
    </div>
    <div class="filter-group">
      <label>
        <input type="checkbox" id="missableFilter"> Missable Only
      </label>
    </div>
    <div class="filter-group">
      <label>
        <input type="checkbox" id="spoilerToggle" checked> Hide Story Spoilers
      </label>
    </div>
    <div class="actions">
      <button id="exportBtn" title="Export progress to JSON">Export</button>
      <button id="importBtn" title="Import progress from JSON">Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
    </div>
  </nav>

  <main class="main">
    <section id="listView" class="view">
      <ul id="trophyList" class="trophy-list"></ul>
    </section>

    <section id="detailView" class="view hidden">
      <button class="back-btn" id="backBtn">← Back to List</button>
      <article id="trophyDetail" class="trophy-detail"></article>
    </section>

    <section id="roadmapView" class="view hidden">
      <button class="back-btn" id="roadmapBackBtn">← Back to List</button>
      <div id="roadmap" class="roadmap"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Data sourced from Exophase, GTABase, Insider Gaming, GTA6 Field Guide, Gamers Together, Push Square (Nov 2026)</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
