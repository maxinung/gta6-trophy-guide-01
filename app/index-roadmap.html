<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI Trophy Guide & Tracker - Roadmap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>GTA VI trophy checklist</h1>
  <p id="progress">0 of 55 earned</p>
</header>

<div class="controls">
  <label>Grade <select id="grade"><option value="all">All</option><option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option></select></label>
  <label>
    <input type="checkbox" id="spoiler"> Spoiler mode (hide hidden trophy names)
  </label>
  <button id="export" type="button">Export progress</button>
  <label class="import">Import progress <input id="import" type="file" accept="application/json"></label>
  <select id="view"><option value="checklist">Checklist</option><option value="roadmap" selected>Roadmap to Platinum</option><option value="missable">Missable & Hidden</option></select>
</div>

<table>
  <thead><tr><th class="earned">Step</th><th class="trophy">Trophy</th><th class="grade">Grade</th><th class="guide">How to get it</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<dialog id="modal">
  <form><h2 id="modal-title">Trophy details</h2>
  <div class="details"><strong>Grade:</strong> <span id="modal-grade"></span></div>
  <div class="details"><strong>Description:</strong> <span id="modal-desc"></span></div>
  <div class="details"><strong>Guide:</strong> <span id="modal-guide"></span></div>
  <div class="details"><strong>Source:</strong> <span id="modal-source"></span></div>
  <div class="source-matrix" id="source-matrix"></div>
  </form><button id="close-modal">Close</button></dialog>

<script type="module" src="app.js"></script>
</body>
</html>
